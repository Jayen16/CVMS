services:
  app:
    build: { context: ., target: production }
    image: cvms-app:production
    env_file: ${COMPOSE_ENV_FILE:-.env.docker}
    restart: unless-stopped
    volumes: [laravel_storage:/var/www/html/storage]
    depends_on:
      mysql: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan about >/dev/null 2>&1"]
      interval: 30s
      timeout: 10s
      retries: 3
  nginx:
    build: { context: ., target: nginx }
    image: cvms-nginx:production
    restart: unless-stopped
    ports:
      - name: http
        target: 80
        published: "80"
        host_ip: "0.0.0.0"
        protocol: tcp
        app_protocol: http
        mode: host
    volumes: [laravel_storage:/var/www/html/storage:ro]
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1/up >/dev/null"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    image: cvms-app:production
    env_file: ${COMPOSE_ENV_FILE:-.env.docker}
    user: app
    command: ["php", "artisan", "queue:work", "--sleep=3", "--tries=3", "--timeout=90", "--max-time=3600"]
    restart: unless-stopped
    volumes: [laravel_storage:/var/www/html/storage]
    depends_on:
      app: { condition: service_healthy }
  scheduler:
    image: cvms-app:production
    env_file: ${COMPOSE_ENV_FILE:-.env.docker}
    user: app
    command: ["php", "artisan", "schedule:work"]
    restart: unless-stopped
    volumes: [laravel_storage:/var/www/html/storage]
    depends_on:
      app: { condition: service_healthy }
  mysql:
    image: mysql:8.4
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: ${DB_DATABASE}
      MYSQL_USER: ${DB_USERNAME}
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
    volumes: [mysql_data:/var/lib/mysql]
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$${MYSQL_ROOT_PASSWORD} --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
volumes:
  mysql_data:
  laravel_storage:
networks:
  default:
    driver: bridge
